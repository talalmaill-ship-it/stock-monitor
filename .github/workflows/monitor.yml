name: Stock Monitor
on:
  push:
    paths: ['monitor.py', 'test_monitor.py', '.github/workflows/monitor.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = Telegram; monitor = alerts; diagnose = data log only'
        type: choice
        options: [test, monitor, diagnose]
        default: test
  schedule:
    # UTC envelope covers both EST and EDT; Python filters in America/New_York.
    # Intended 15-minute cadence; GitHub may delay or skip scheduled runs.
    - cron: '0,15,30,45 8-23 * * 1-5'
    - cron: '0,15,30,45 0-2 * * 2-6'
permissions:
  contents: write
  actions: write
concurrency:
  group: stock-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      STATE_BRANCH: ${{ github.event.repository.default_branch }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      MODE: ${{ inputs.mode || (github.event_name == 'push' && 'diagnose') || 'monitor' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify monitor logic
        run: python -m unittest -q
      - name: Check time and automatic expiry
        id: gate
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from monitor import NY, phase, disable
          p = phase(datetime.now(NY))
          active = os.environ['MODE'] in ('test', 'diagnose') or p in ('monitor', 'summary')
          if p == 'expired' and os.environ['MODE'] == 'monitor':
              disable()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"active={str(active).lower()}\n")
          PY
      - name: Install market data library
        if: steps.gate.outputs.active == 'true' && env.MODE != 'test'
        run: python -m pip install -r requirements.txt
      - name: Check stocks or send test
        if: steps.gate.outputs.active == 'true'
        run: python monitor.py --mode "$MODE"
