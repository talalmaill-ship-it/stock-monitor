name: Verify Telegram and data
on:
  push:
    paths: ['.github/workflows/verify-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-monitor
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and test each Telegram destination
        run: |
          python - <<'PY'
          import os, json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from datetime import datetime
          from monitor import NY
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          if not token:
              raise SystemExit('Missing Telegram bot token.')
          failed = False
          for label, variable in [('private', 'TELEGRAM_CHAT_ID'), ('group', 'TELEGRAM_GROUP_CHAT_ID')]:
              chat = os.environ.get(variable, '').strip()
              if not chat:
                  print(label + ': missing chat ID secret.')
                  failed = True
                  continue
              if label == 'group' and not chat.startswith('-'):
                  print('group: ID does not start with minus; verify the group chat.id.')
              for method in ('getChat', 'sendMessage'):
                  payload = {'chat_id': chat}
                  if method == 'sendMessage':
                      payload['text'] = '✅ اختبار الخاص والقروب: اتصال Telegram يعمل. هذه رسالة اختبار وليست تنبيه حركة.\n' + datetime.now(NY).strftime('NY: %Y-%m-%d %H:%M %Z')
                  req = Request('https://api.telegram.org/bot' + token + '/' + method,
                                data=json.dumps(payload).encode(),
                                headers={'Content-Type': 'application/json'})
                  try:
                      with urlopen(req, timeout=20) as response:
                          result = json.load(response)
                      if not result.get('ok'):
                          raise ValueError('Rejected')
                      print(label + ': ' + method + ' accepted by Telegram.')
                  except HTTPError as exc:
                      try:
                          error = json.loads(exc.read())
                          description = error.get('description', '').lower()
                      except Exception:
                          description = ''
                      reason = 'unknown API rejection'
                      for known in ('chat not found', 'bot was kicked', 'bot was blocked',
                                    'not enough rights', 'group chat was upgraded',
                                    'bot is not a member', 'chat_write_forbidden'):
                          if known in description:
                              reason = known
                              break
                      print(label + ': ' + method + ' failed: HTTP ' + str(exc.code) + '; ' + reason)
                      failed = True
                      break
                  except Exception:
                      print(label + ': ' + method + ' failed; no credentials printed.')
                      failed = True
                      break
          if failed:
              raise SystemExit(1)
          PY
