name: Verify Telegram and data
on:
  push:
    paths: ['.github/workflows/verify-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-monitor
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send requested private and group test
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from monitor import NY, telegram
          if not os.environ.get('TELEGRAM_GROUP_CHAT_ID', '').strip():
              raise SystemExit('Missing TELEGRAM_GROUP_CHAT_ID secret; group test cannot run.')
          telegram('✅ اختبار الخاص والقروب: اتصال Telegram يعمل. هذه رسالة اختبار وليست تنبيه حركة.\n' + datetime.now(NY).strftime('NY: %Y-%m-%d %H:%M %Z'))
          print('Telegram API accepted the test for all configured chats.')
          PY
      - name: Install data library
        if: always()
        run: python -m pip install -r requirements.txt
      - name: Verify both data providers without alerts
        if: always()
        run: python monitor.py --mode diagnose
